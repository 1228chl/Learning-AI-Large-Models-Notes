<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #dfeaf5; }
    body { display: grid; place-items: center; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
    #wrap { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; }
    #infographic { width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); display: block; }
    .controls { position: absolute; z-index: 10; top: max(8px, calc((100vh - min(100vh, 100vw * 9 / 16)) / 2 + 8px)); right: max(14px, calc((100vw - min(100vw, 100vh * 16 / 9)) / 2 + 22px)); display: flex; gap: 7px; }
    .controls button { height: 30px; padding: 0 13px; border-radius: 9px; border: 1px solid #bdd1e8; background: rgba(255,255,255,.9); color: #355778; font: 700 13px "Microsoft YaHei", sans-serif; box-shadow: 0 5px 14px rgba(49,83,125,.12); cursor: pointer; }
    .controls .primary { background: #2368e8; color: #fff; border-color: #2368e8; }
    .scene { transition: opacity .32s ease, filter .32s ease; }
    #infographic.playing .scene { opacity: .34; filter: saturate(.55); }
    #infographic.playing .scene.live { opacity: 1; filter: saturate(1.08); }
    .flow-dot { opacity: 0; transition: opacity .25s ease; }
    #infographic.playing .flow-dot { opacity: 1; }
    body.export .controls { display: none; }
    body.export *, body.export *::before, body.export *::after { animation: none !important; transition: none !important; }
  </style>
</head>
<body>

  <script>
    (() => {
      const svg = document.getElementById('infographic');
      const groups = [
        ['before'], ['after'], ['app','architecture'], ['host'],
        ['client','boundary','route'], ['server','messages'], ['adapter','system'],
        ['llm','user'], ['values','timeline','summary']
      ];
      let timers = [], currentStep = -1, paused = false;
      const scenes = [...svg.querySelectorAll('[data-scene]')];
      const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
      const clearLive = () => scenes.forEach(el => el.classList.remove('live'));
      const focus = (names) => { clearLive(); names.forEach(n => svg.querySelectorAll(`[data-scene="${n}"]`).forEach(el => el.classList.add('live'))); };
      const showAll = () => { paused = false; currentStep = -1; clearTimers(); clearLive(); svg.classList.remove('playing'); };
      const renderStep = (step) => { svg.classList.add('playing'); focus(groups[step]); };
      const showStep = (step) => {
        clearTimers();
        paused = true;
        currentStep = Math.max(0, Math.min(step, groups.length - 1));
        renderStep(currentStep);
      };
      const advance = () => {
        if (paused) return;
        if (currentStep < groups.length - 1) {
          currentStep += 1;
          renderStep(currentStep);
          timers.push(setTimeout(advance, 1200));
        } else {
          timers.push(setTimeout(showAll, 1600));
        }
      };
      document.getElementById('play').onclick = () => { clearTimers(); paused = false; currentStep = -1; advance(); };
      document.getElementById('previous').onclick = () => { if (currentStep > 0) showStep(currentStep - 1); };
      document.getElementById('next').onclick = () => { if (currentStep < groups.length - 1) showStep(currentStep + 1); };
      document.getElementById('pause').onclick = () => { paused = true; clearTimers(); };
      document.getElementById('all').onclick = showAll;
      if (new URLSearchParams(location.search).get('export') === '1') document.body.classList.add('export');
      window.__MCP_INFOGRAPHIC_READY__ = true;
    })();
  </script>
